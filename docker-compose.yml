services:
  guildmaster:
    image: guildmaster:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8080}"
      DATABASE_PATH: "${DATABASE_PATH:-/data/guildmaster.db}"
      SPREADSHEET_ID: "${SPREADSHEET_ID:-}"
      SCOREBOARD_API_KEY: "${SCOREBOARD_API_KEY:-}"
      GUILDMASTER_ADMIN_KEY: "${GUILDMASTER_ADMIN_KEY:-}"
    volumes:
      - ./data:/data
